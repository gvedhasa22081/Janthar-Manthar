<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Try Not To Laugh - 15 Memes | SPARK</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Bangers&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Fredoka',sans-serif;background:#111;color:#fff;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;background:
radial-gradient(600px at 10% 10%, #FFE60055, transparent),
radial-gradient(600px at 90% 90%, #FF3B8244, transparent),
#111}

/* START */
#start{position:fixed;inset:0;z-index:999;background:#111;display:flex;align-items:center;justify-content:center;padding:20px}
.startBox{background:#fff;color:#000;border:5px solid #000;border-radius:32px;padding:28px 20px;width:100%;max-width:380px;text-align:center;box-shadow:14px 14px 0 #FFE600;animation:popIn .6s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{0%{transform:scale(.6) rotate(-3deg)}100%{transform:scale(1) rotate(0)}}
.startBox h1{font-family:'Bangers';font-size:52px;line-height:.85;letter-spacing:1px} .startBox h1 span{color:#FF3B82;font-size:56px;display:block}
.tag{background:#000;color:#FFE600;display:inline-block;padding:5px 14px;border-radius:20px;font-weight:800;margin:10px 0;font-size:13px;letter-spacing:1px}
.btnStart{width:100%;background:#00FF88;border:4px solid #000;border-radius:16px;padding:16px;font-family:'Bangers';font-size:28px;letter-spacing:2px;box-shadow:6px 6px 0 #000;cursor:pointer;margin-top:12px}
.btnStart:active{transform:translate(3px,3px);box-shadow:2px 2px 0 #000}

/* GAME */
header{max-width:500px;margin:0 auto;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
.logo{font-family:'Bangers';font-size:30px;line-height:.9} .logo span{color:#FF3B82}
.lives{background:#fff;color:#000;border:3px solid #000;border-radius:30px;padding:6px 14px;font-weight:800;box-shadow:3px 3px 0 #000}
.wrap{max-width:500px;margin:0 auto;padding:0 14px 20px}
.progress{height:16px;background:#fff;border:3px solid #000;border-radius:20px;overflow:hidden;box-shadow:2px 2px 0 #000;margin-bottom:12px}
.bar{height:100%;background:linear-gradient(90deg,#FFE600,#FF3B82,#00E5FF);width:0%;transition:width .5s}
.card{background:#fff;border:4px solid #000;border-radius:24px;padding:8px;box-shadow:10px 10px 0 #FFE600}

/* BIG IMAGE - NO CROP */
.imgBox{
  position:relative;
  background:#fff;
  border:3px solid #000;
  border-radius:18px;
  width:100%;
  height:72vh;
  min-height:480px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.imgBox img{
  max-width:100%;
  max-height:100%;
  width:auto;
  height:auto;
  object-fit:contain;
  display:block;
}
.badge{position:absolute;top:10px;left:10px;z-index:3;background:#FFE600;border:2.5px solid #000;border-radius:10px;padding:4px 10px;font-weight:800;color:#000;box-shadow:2px 2px 0 #000;font-size:12px}
.countTxt{position:absolute;top:10px;right:10px;z-index:3;background:#000;color:#fff;border-radius:10px;padding:4px 10px;font-weight:700;font-size:12px}

/* TIMER OVERLAY */
.timer{position:absolute;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10}
.ring{width:150px;height:150px;border:6px solid #ffffff22;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative}
.ring::after{content:'';position:absolute;inset:-6px;border:6px solid #FFE600;border-radius:50%;border-top-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tNum{font-family:'Bangers';font-size:96px;color:#FFE600;-webkit-text-stroke:3px #000;text-shadow:6px 6px 0 #000;animation:popNum .6s cubic-bezier(.34,1.56,.64,1)}
@keyframes popNum{0%{transform:scale(0) rotate(-20deg)}60%{transform:scale(1.5) rotate(10deg)}100%{transform:scale(1) rotate(0)}}
.tLabel{background:#fff;color:#000;border:2px solid #000;border-radius:20px;padding:4px 12px;font-weight:800;font-size:12px;margin-top:10px}

.controls{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:14px;border:3px solid #000;border-radius:14px;font-weight:800;box-shadow:4px 4px 0 #000;cursor:pointer;font-family:'Fredoka';font-size:14px}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.btnLaugh{background:#FF3B82;color:#fff} .btnNext{background:#00E5FF;color:#000}

.footer{text-align:center;padding:16px;color:#888;font-size:12px;font-weight:600}
.footer b{background:#fff;color:#000;border:2px solid #000;padding:2px 8px;border-radius:20px}

#end{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(8px);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.endBox{background:#fff;color:#000;border:5px solid #000;border-radius:28px;padding:28px;max-width:360px;width:100%;text-align:center;box-shadow:12px 12px 0 #FF3B82}
</style>
</head>
<body>
<div class="bg"></div>

<div id="start">
  <div class="startBox">
    <h1>TRY NOT TO <span>LAUGH! 😂</span></h1>
    <div class="tag">15 MEMES CHALLENGE</div>
    <div style="background:#f5f5f5;border:3px solid #000;border-radius:14px;padding:12px;text-align:left;font-size:13px;line-height:1.4">
      ❤️ 3 Lives - laugh = lose 1<br>
      ⏱️ 3-2-1 Timer for each pic<br>
      🖼️ 1.jpg → 15.jpg in order<br>
      🏆 Survive all = LEGEND
    </div>
    <button class="btnStart" onclick="startGame()">START CHALLENGE 🚀</button>
    <div style="margin-top:12px;font-size:12px;font-weight:700">Developed with 💛 by <b style="background:#000;color:#FFE600;padding:2px 8px;border-radius:10px">SPARK</b></div>
    <div id="status" style="font-size:10px;margin-top:8px;opacity:.7"></div>
  </div>
</div>

<header>
  <div class="logo">TRY NOT TO<br><span>LAUGH!</span></div>
  <div class="lives" id="lives">❤️❤️❤️ 3</div>
</header>

<div class="wrap">
  <div class="progress"><div class="bar" id="bar"></div></div>
  <div class="card">
    <div class="imgBox" id="imgBox">
      <div class="badge" id="badge">MEME #1</div>
      <div class="countTxt" id="countTxt">1 / 15</div>
      <img id="meme" src="" alt="meme">
      <div class="timer" id="timer">
        <div class="ring"><div class="tNum" id="tNum">3</div></div>
        <div class="tLabel" id="tLabel">DON'T LAUGH...</div>
      </div>
    </div>
    <div class="controls">
      <button class="btn btnLaugh" onclick="laugh()">😂 I LAUGHED</button>
      <button class="btn btnNext" onclick="nextMeme(true)">NEXT 😐</button>
    </div>
  </div>
</div>

<div class="footer">✨ Developed by <b>SPARK</b> ✨ • 15 Funny Pics</div>

<div id="end">
  <div class="endBox">
    <div style="font-size:70px" id="eEmoji">🏆</div>
    <h2 style="font-family:Bangers;font-size:34px" id="eTitle">LEGEND!</h2>
    <p id="eText" style="margin:8px 0 14px;font-weight:600"></p>
    <button class="btn btnNext" style="width:100%;background:#FFE600" onclick="location.reload()">PLAY AGAIN 🔁</button>
    <div style="margin-top:10px;font-size:11px">by <b>SPARK</b></div>
  </div>
</div>

<script>
let pics=[],cur=0,lives=3,score=0,timerInt=null,count=3,busy=false;
const memeImg=document.getElementById('meme');
const bases=["","Janthar-Manthar/","images/","./"];
const exts=[".jpg",".JPG",".jpeg",".png",".webp"];

async function findOne(n){
  for(let b of bases){
    for(let e of exts){
      let url=b+n+e;
      let ok=await new Promise(r=>{let i=new Image();i.onload=()=>r(url);i.onerror=()=>r(null);i.src=url+'?v='+Date.now();});
      if(ok) return ok;
    }
  }
  return null;
}

async function loadPics(){
  let st=document.getElementById('status');
  pics=[];
  for(let i=1;i<=15;i++){
    st.innerText=`Checking ${i}.jpg... Found ${pics.length}`;
    let f=await findOne(i);
    if(f) pics.push(f);
  }
  if(pics.length===0){
    st.innerHTML=`❌ No pics found!<br>Make sure 1.jpg is in same folder as index.html`;
  }else{
    st.innerText=`✅ Found ${pics.length} / 15 memes - READY!`;
  }
}

function startGame(){
  if(pics.length===0){alert('No 1.jpg found! Upload 1.jpg to 15.jpg in repo root');return;}
  document.getElementById('start').style.display='none';
  showMeme();
}

function showMeme(){
  memeImg.src=pics[cur];
  document.getElementById('badge').innerText=`MEME #${cur+1}`;
  document.getElementById('countTxt').innerText=`${cur+1} / ${pics.length}`;
  document.getElementById('bar').style.width=`${(cur+1)/pics.length*100}%`;
  document.getElementById('lives').innerText='❤️'.repeat(lives)+` ${lives}`;
  startTimer();
}

function startTimer(){
  busy=true; count=3;
  const timer=document.getElementById('timer');
  const num=document.getElementById('tNum');
  const label=document.getElementById('tLabel');
  timer.style.display='flex';
  const labels=['GET READY...','HOLD IT...','DON\'T LAUGH!'];
  num.innerText=count; label.innerText=labels[3-count];
  num.style.animation='none'; num.offsetHeight; num.style.animation='popNum .6s cubic-bezier(.34,1.56,.64,1)';
  if(navigator.vibrate) navigator.vibrate(50);
  timerInt=setInterval(()=>{
    count--;
    if(count>0){
      num.innerText=count; label.innerText=labels[3-count];
      num.style.animation='none'; num.offsetHeight; num.style.animation='popNum .6s cubic-bezier(.34,1.56,.64,1)';
      if(navigator.vibrate) navigator.vibrate(60);
    }else{
      clearInterval(timerInt); timer.style.display='none'; busy=false;
    }
  },900);
}

function nextMeme(manual=false){
  if(busy && !manual) return;
  clearInterval(timerInt); document.getElementById('timer').style.display='none'; busy=false;
  if(cur < pics.length-1){cur++; score++; showMeme();}
  else{showEnd(true);}
}

function laugh(){
  lives--;
  if(navigator.vibrate) navigator.vibrate([80,30,80]);
  if(lives<=0) showEnd(false);
  else nextMeme(true);
}

function showEnd(win){
  document.getElementById('end').style.display='flex';
  document.getElementById('eEmoji').innerText=win?'🏆':'💀';
  document.getElementById('eTitle').innerText=win?'YOU ARE LEGEND!' : 'YOU LAUGHED!';
  document.getElementById('eText').innerText=win?`You survived all ${pics.length} memes! Unbeatable! Developed by SPARK` : `Survived ${score} / ${pics.length} memes. Try again! Developed by SPARK`;
}

loadPics();
</script>
</body>
</html>
